<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎲 MBTI 深层人格图谱测试（120题·生活场景版）</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f7f6f2;
    --card: #ffffff;
    --text: #1a1917;
    --muted: #6b6a66;
    --hint: #9e9d99;
    --border: rgba(0,0,0,0.12);
    --border-sm: rgba(0,0,0,0.08);
    --radius: 14px;
    --radius-sm: 8px;

    --ei-col: #4f46e5;
    --ei-bg: #eef2ff;
    --sn-col: #d97706;
    --sn-bg: #fffbeb;
    --tf-col: #0891b2;
    --tf-bg: #ecfeff;
    --jp-col: #16a34a;
    --jp-bg: #f0fdf4;

    --sel-1: #e24b4a;
    --sel-2: #e88a23;
    --sel-3: #888780;
    --sel-4: #1d9e75;
    --sel-5: #4f46e5;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 80px;
    font-size: 15px;
    line-height: 1.6;
  }

  /* ===== HEADER ===== */
  .header {
    background: var(--card);
    border-bottom: 0.5px solid var(--border-sm);
    padding: 24px 20px 20px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-emoji { font-size: 32px; margin-bottom: 6px; }
  .header h1 {
    font-size: 18px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 4px;
  }
  .header p { font-size: 13px; color: var(--muted); }

  /* ===== PROGRESS ===== */
  .progress-bar {
    position: sticky;
    top: 105px;
    z-index: 99;
    background: var(--card);
    padding: 10px 20px;
    border-bottom: 0.5px solid var(--border-sm);
  }
  .progress-track {
    height: 4px;
    background: var(--border-sm);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--ei-col), var(--sn-col), var(--tf-col), var(--jp-col));
    border-radius: 2px;
    transition: width 0.3s ease;
  }
  .progress-text {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--hint);
    margin-top: 6px;
  }

  /* ===== LEGEND ===== */
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    padding: 14px 20px;
    font-size: 12px;
    color: var(--muted);
    background: var(--card);
    border-bottom: 0.5px solid var(--border-sm);
    position: sticky;
    top: 145px;
    z-index: 98;
  }
  .legend span { display: flex; align-items: center; gap: 4px; }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  /* ===== SECTION ===== */
  .section {
    max-width: 680px;
    margin: 24px auto;
    padding: 0 16px;
  }
  .section-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
    padding: 12px 16px;
    border-radius: var(--radius);
    background: var(--card);
    border: 0.5px solid var(--border-sm);
  }
  .section-icon { font-size: 20px; }
  .section-title { font-size: 15px; font-weight: 500; }
  .section-sub { font-size: 12px; color: var(--muted); margin-top: 1px; }

  /* ===== QUESTION CARD ===== */
  .q-card {
    background: var(--card);
    border: 0.5px solid var(--border-sm);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 10px;
    transition: border-color 0.2s;
  }
  .q-card.answered { border-color: rgba(0,0,0,0.15); }
  .q-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 10px;
  }
  .q-num {
    font-size: 11px;
    font-weight: 500;
    color: var(--hint);
    min-width: 28px;
  }
  .q-dim {
    font-size: 10px;
    font-weight: 500;
    padding: 2px 7px;
    border-radius: 20px;
    letter-spacing: 0.3px;
  }
  .dim-ei { background: var(--ei-bg); color: var(--ei-col); }
  .dim-sn { background: var(--sn-bg); color: var(--sn-col); }
  .dim-tf { background: var(--tf-bg); color: var(--tf-col); }
  .dim-jp { background: var(--jp-bg); color: var(--jp-col); }

  .q-text {
    font-size: 14px;
    line-height: 1.65;
    color: var(--text);
    margin-bottom: 14px;
  }

  /* ===== SCALE ===== */
  .scale {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .scale-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 8px 4px 6px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: transparent;
    cursor: pointer;
    transition: all 0.15s;
    min-width: 0;
  }
  .scale-btn:active { transform: scale(0.95); }
  .scale-num {
    font-size: 15px;
    font-weight: 500;
    color: var(--muted);
    line-height: 1;
  }
  .scale-label {
    font-size: 9px;
    color: var(--hint);
    text-align: center;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }

  /* Selected states */
  .scale-btn[data-v="1"].active { background: var(--sel-1); border-color: var(--sel-1); }
  .scale-btn[data-v="1"].active .scale-num,
  .scale-btn[data-v="1"].active .scale-label { color: #fff; }

  .scale-btn[data-v="2"].active { background: var(--sel-2); border-color: var(--sel-2); }
  .scale-btn[data-v="2"].active .scale-num,
  .scale-btn[data-v="2"].active .scale-label { color: #fff; }

  .scale-btn[data-v="3"].active { background: var(--sel-3); border-color: var(--sel-3); }
  .scale-btn[data-v="3"].active .scale-num,
  .scale-btn[data-v="3"].active .scale-label { color: #fff; }

  .scale-btn[data-v="4"].active { background: var(--sel-4); border-color: var(--sel-4); }
  .scale-btn[data-v="4"].active .scale-num,
  .scale-btn[data-v="4"].active .scale-label { color: #fff; }

  .scale-btn[data-v="5"].active { background: var(--sel-5); border-color: var(--sel-5); }
  .scale-btn[data-v="5"].active .scale-num,
  .scale-btn[data-v="5"].active .scale-label { color: #fff; }

  /* ===== SUBMIT BAR ===== */
  .submit-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--card);
    border-top: 0.5px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 200;
  }
  .submit-info { flex: 1; font-size: 13px; color: var(--muted); }
  .submit-info strong { color: var(--text); font-weight: 500; }
  .btn-submit {
    padding: 10px 24px;
    border-radius: 10px;
    border: none;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    background: var(--text);
    color: #fff;
    transition: opacity 0.2s;
  }
  .btn-submit:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-submit:not(:disabled):hover { opacity: 0.85; }

  /* ===== RESULT PAGE ===== */
  #result-page { display: none; max-width: 680px; margin: 0 auto; padding: 24px 16px 120px; }
  .result-hero {
    background: var(--card);
    border-radius: var(--radius);
    border: 0.5px solid var(--border-sm);
    padding: 28px 24px;
    text-align: center;
    margin-bottom: 16px;
  }
  .result-type {
    font-size: 56px;
    font-weight: 500;
    letter-spacing: 6px;
    color: var(--text);
    line-height: 1;
    margin-bottom: 6px;
  }
  .result-name {
    font-size: 18px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 8px;
  }
  .result-desc {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.7;
    max-width: 460px;
    margin: 0 auto;
  }

  /* ===== DIM BARS ===== */
  .dim-bars { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .dim-bar-card {
    background: var(--card);
    border: 0.5px solid var(--border-sm);
    border-radius: var(--radius);
    padding: 14px 16px;
  }
  .dim-bar-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    font-size: 13px;
  }
  .dim-bar-left { font-weight: 500; }
  .dim-bar-right { font-weight: 500; }
  .dim-bar-pct { font-size: 12px; color: var(--muted); }
  .dim-track {
    height: 8px;
    background: var(--border-sm);
    border-radius: 4px;
    overflow: visible;
    position: relative;
  }
  .dim-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .dim-mid {
    position: absolute;
    top: -3px;
    left: 50%;
    transform: translateX(-50%);
    width: 1px;
    height: 14px;
    background: var(--border);
  }

  /* ===== TRAITS ===== */
  .traits-card {
    background: var(--card);
    border: 0.5px solid var(--border-sm);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 16px;
  }
  .traits-title { font-size: 13px; font-weight: 500; margin-bottom: 12px; color: var(--muted); }
  .traits-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .trait-tag {
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    background: var(--bg);
    color: var(--text);
    border: 0.5px solid var(--border);
  }

  /* ===== ACTION BUTTONS ===== */
  .action-row {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }
  .btn-action {
    flex: 1;
    padding: 12px;
    border-radius: var(--radius-sm);
    border: 0.5px solid var(--border);
    background: var(--card);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    color: var(--text);
    transition: background 0.15s;
  }
  .btn-action:hover { background: var(--bg); }
  .btn-action.primary {
    background: var(--text);
    color: #fff;
    border-color: var(--text);
  }
  .btn-action.primary:hover { opacity: 0.85; }

  /* ===== SHARE MODAL ===== */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 500;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--card);
    border-radius: 20px 20px 0 0;
    padding: 24px 20px 36px;
    width: 100%;
    max-width: 480px;
  }
  .modal-handle {
    width: 36px; height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 0 auto 20px;
  }
  .modal-title { font-size: 15px; font-weight: 500; margin-bottom: 16px; }
  .share-url {
    display: flex;
    gap: 8px;
    align-items: center;
    background: var(--bg);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    margin-bottom: 16px;
    font-size: 12px;
    color: var(--muted);
    word-break: break-all;
    gap: 8px;
  }
  .share-url-text { flex: 1; }
  .btn-copy {
    padding: 6px 14px;
    border-radius: 6px;
    border: 0.5px solid var(--border);
    background: var(--card);
    font-size: 12px;
    cursor: pointer;
    flex-shrink: 0;
    font-weight: 500;
  }
  .share-note { font-size: 12px; color: var(--hint); line-height: 1.6; }
  .modal-close {
    width: 100%;
    padding: 12px;
    border-radius: var(--radius-sm);
    border: 0.5px solid var(--border);
    background: transparent;
    font-size: 14px;
    cursor: pointer;
    margin-top: 16px;
    color: var(--muted);
  }

  /* ===== SCROLL TO TOP ===== */
  .back-top {
    position: fixed;
    bottom: 80px;
    right: 20px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--text);
    color: #fff;
    border: none;
    font-size: 18px;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 150;
    opacity: 0.7;
  }
  .back-top.show { display: flex; }

  /* ===== TOAST ===== */
  .toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(26,25,23,0.9);
    color: #fff;
    padding: 10px 20px;
    border-radius: 24px;
    font-size: 13px;
    opacity: 0;
    transition: all 0.25s;
    z-index: 600;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 480px) {
    .scale-label { display: none; }
    .scale-btn { padding: 10px 4px 10px; }
    .scale-num { font-size: 16px; }
    .result-type { font-size: 42px; letter-spacing: 4px; }
  }
</style>
  <script src="mbti_data.js"></script>
</head>
<body>

<!-- QUIZ PAGE -->
<div id="quiz-page">
  <div class="header">
    <div class="header-emoji">🎲</div>
    <h1>MBTI 深层人格图谱测试</h1>
    <p>120题 · 生活场景版 · 根据第一直觉作答效果最佳</p>
  </div>

  <div class="progress-bar">
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill" style="width:0%"></div>
    </div>
    <div class="progress-text">
      <span id="progress-count">已答 0 / 120 题</span>
      <span id="progress-pct">0%</span>
    </div>
  </div>

  <div class="legend">
    <span><span class="legend-dot" style="background:#4f46e5"></span>E/I 能量</span>
    <span><span class="legend-dot" style="background:#d97706"></span>S/N 感知</span>
    <span><span class="legend-dot" style="background:#0891b2"></span>T/F 决策</span>
    <span><span class="legend-dot" style="background:#16a34a"></span>J/P 秩序</span>
    <span style="margin-left:4px; color:#9e9d99">⑤极像 ④有点 ③中立 ②不太 ①极不</span>
  </div>

  <div id="questions-container"></div>

  <div class="submit-bar">
    <div class="submit-info"><strong id="answered-count">0</strong> / 120 已作答</div>
    <button class="btn-submit" id="btn-submit" disabled onclick="submitQuiz()">查看结果</button>
  </div>
</div>

<!-- RESULT PAGE -->
<div id="result-page">
  <div class="result-hero" id="result-hero">
    <div class="result-type" id="result-type-text">INFJ</div>
    <div class="result-name" id="result-name-text">提倡者</div>
    <div class="result-desc" id="result-desc-text"></div>
  </div>

  <div class="dim-bars" id="dim-bars"></div>

  <div class="traits-card">
    <div class="traits-title">你的典型特质</div>
    <div class="traits-grid" id="traits-grid"></div>
  </div>

  <div class="action-row">
    <button class="btn-action" onclick="retakeQuiz()">重新测试</button>
    <button class="btn-action primary" onclick="openShare()">分享结果</button>
  </div>

  <div class="traits-card" id="detail-section">
    <div class="traits-title">完整维度分析</div>
    <div id="detail-content" style="font-size:13px;color:var(--muted);line-height:1.8;"></div>
  </div>
</div>

<!-- SHARE MODAL -->
<div class="modal-overlay" id="share-modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">分享给朋友</div>
    <div class="share-url">
      <div class="share-url-text" id="share-url-text"></div>
      <button class="btn-copy" onclick="copyUrl()">复制</button>
    </div>
    <div class="share-note">
      复制链接发给朋友，他们可以独立完成测试并查看自己的结果。<br>
      本测试完全在浏览器本地运行，不收集任何个人数据。
    </div>
    <button class="modal-close" onclick="closeShare()">关闭</button>
  </div>
</div>

<button class="back-top" id="back-top" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>
<div class="toast" id="toast"></div>

<script>
// ============================================================
//  QUESTIONS DATA
// ============================================================
const QUESTIONS = [
  // ===== E/I 维度 (1-30) =====
  // 题1-30全部是I方向（高分=倾向I），反向计分=E
  {id:1, dim:'ei', dir:'I', text:'周末朋友突然组局，即便你原本没安排，也会觉得"好烦，被打乱了"而不是"好耶"。'},
  {id:2, dim:'ei', dir:'I', text:'在聚会中，比起成为焦点，你更享受躲在角落观察人类行为。'},
  {id:3, dim:'ei', dir:'I', text:'即使心里很想见某人，也会因为"出门太麻烦"而选择线上聊天。'},
  {id:4, dim:'ei', dir:'I', text:'你经常发现，自己在脑子里已经把某件事排练了八百遍，开口却只说了两个字。'},
  {id:5, dim:'ei', dir:'I', text:'人多的时候你会自动开启"省电模式"，不想说话只想发呆。'},
  {id:6, dim:'ei', dir:'I', text:'比起电话沟通，你更愿意发长语音或文字，因为这样可以编辑和修改。'},
  {id:7, dim:'ei', dir:'I', text:'旅行途中如果一直有人同行，你会感到社交能量透支，急需一个人躲一会儿。'},
  {id:8, dim:'ei', dir:'I', text:'你更喜欢一对一的深度谈话，而不是一群人的狂欢。'},
  {id:9, dim:'ei', dir:'I', text:'当你兴奋地分享一件事时，如果对方反应平淡，你会立刻闭嘴并后悔。'},
  {id:10, dim:'ei', dir:'I', text:'你家里的"避难所"（如书房、浴室）是你一天中最期待待的地方。'},
  {id:11, dim:'ei', dir:'I', text:'你在人群中会感到一种莫名的"感官过载"（太吵、太亮、气味太杂）。'},
  {id:12, dim:'ei', dir:'I', text:'即使是好朋友，你也很少主动发起聊天，通常是被动回应。'},
  {id:13, dim:'ei', dir:'I', text:'周末两天的完美安排是：宅家看书、刷剧、打游戏，哪儿也不去。'},
  {id:14, dim:'ei', dir:'I', text:'你觉得"下次一起吃饭"通常只是一种客套，并不真的期待落实。'},
  {id:15, dim:'ei', dir:'I', text:'你在陌生环境里，会下意识观察逃生通道和人群动向。'},
  {id:16, dim:'ei', dir:'I', text:'比起参加派对，你更愿意在家研究一道复杂的菜谱。'},
  {id:17, dim:'ei', dir:'I', text:'你经常被人评价为"高冷"或"慢热"，但其实你只是还没热身。'},
  {id:18, dim:'ei', dir:'I', text:'如果可以选，你宁愿花一整天时间整理自己的收藏/爱好，也不愿去逛街。'},
  {id:19, dim:'ei', dir:'I', text:'你在社交媒体上很活跃，但在现实中却是个沉默寡言的人。'},
  {id:20, dim:'ei', dir:'I', text:'你很难理解那些"为了社交而社交"的行为。'},
  {id:21, dim:'ei', dir:'I', text:'即使是去喜欢的演唱会，结束后你也需要半天时间安静回血。'},
  {id:22, dim:'ei', dir:'I', text:'你更喜欢"接收"信息，而不是"发射"信息。'},
  {id:23, dim:'ei', dir:'I', text:'你经常会沉浸在自己的白日梦或幻想世界里。'},
  {id:24, dim:'ei', dir:'I', text:'你觉得"独处"不是孤独，而是一种享受。'},
  {id:25, dim:'ei', dir:'I', text:'面对冲突，你的第一反应是回避，而不是当场对峙。'},
  {id:26, dim:'ei', dir:'I', text:'你更喜欢通过文字来表达那些细腻的情感，因为语言往往词不达意。'},
  {id:27, dim:'ei', dir:'I', text:'你会在心里默默吐槽聚会上无聊的话题，但脸上保持着礼貌的微笑。'},
  {id:28, dim:'ei', dir:'I', text:'比起大型游乐园，你更喜欢去安静的博物馆或美术馆。'},

const SECTIONS = [
  { id:'s1', icon:'🔴', title:'第一部分：能量补给', sub:'E/I 维度 · 社交、独处、信息输入', dim:'ei', start:1, end:30 },
  { id:'s2', icon:'🟡', title:'第二部分：感知滤镜', sub:'S/N 维度 · 购物、回忆、想象力、细节', dim:'sn', start:31, end:60 },
  { id:'s3', icon:'🔵', title:'第三部分：决策心法', sub:'T/F 维度 · 吵架、送礼、评价他人', dim:'tf', start:61, end:90 },
  { id:'s4', icon:'🟢', title:'第四部分：生活秩序', sub:'J/P 维度 · 计划、拖延、突发状况', dim:'jp', start:91, end:120 },
];

const LABELS = { 1:'极不符合', 2:'不太符合', 3:'中立', 4:'比较符合', 5:'非常符合' };

function buildQuestions() {
  const container = document.getElementById('questions-container');
  SECTIONS.forEach(sec => {
    const secDiv = document.createElement('div');
    secDiv.className = 'section';
    secDiv.innerHTML = `
      <div class="section-header">
        <span class="section-icon">${sec.icon}</span>
        <div>
          <div class="section-title">${sec.title}</div>
          <div class="section-sub">${sec.sub}</div>
        </div>
      </div>`;
    const sectionQs = QUESTIONS.filter(q => q.id >= sec.start && q.id <= sec.end);
    sectionQs.forEach(q => {
      const card = document.createElement('div');
      card.className = 'q-card';
      card.id = `q-card-${q.id}`;
      card.innerHTML = `
        <div class="q-meta">
          <span class="q-num">${q.id}.</span>
          <span class="q-dim dim-${q.dim}">${q.dim.toUpperCase()}</span>
        </div>
        <div class="q-text">${window.EXPANDED_QUESTIONS && EXPANDED_QUESTIONS[q.id - 1] ? EXPANDED_QUESTIONS[q.id - 1] : q.text}</div>
        <div class="scale" id="scale-${q.id}">
          ${[1,2,3,4,5].map(v=>`
            <button class="scale-btn" data-qid="${q.id}" data-v="${v}" onclick="selectAnswer(${q.id},${v})">
              <span class="scale-num">${v}</span>
              <span class="scale-label">${LABELS[v]}</span>
            </button>
          `).join('')}
        </div>`;
      secDiv.appendChild(card);
    });
    container.appendChild(secDiv);
  });
}

function selectAnswer(qid, val) {
  const wasAnswered = answers[qid] !== undefined;
  answers[qid] = val;

  const scale = document.getElementById(`scale-${qid}`);
  scale.querySelectorAll('.scale-btn').forEach(btn => {
    btn.classList.toggle('active', parseInt(btn.dataset.v) === val);
  });

  const card = document.getElementById(`q-card-${qid}`);
  card.classList.add('answered');

  if (!wasAnswered) updateProgress();
}

function updateProgress() {
  const n = Object.keys(answers).length;
  const pct = Math.round(n / 120 * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-count').textContent = `已答 ${n} / 120 题`;
  document.getElementById('progress-pct').textContent = pct + '%';
  document.getElementById('answered-count').textContent = n;
  document.getElementById('btn-submit').disabled = n < 120;
}

// ============================================================
//  SCORING
// ============================================================
function calcScores() {
  // Each dimension: 30 questions, each 1-5
  // Raw sum range: 30-150
  // Higher score = first letter (I, S, T, J)
  const sums = { ei: 0, sn: 0, tf: 0, jp: 0 };
  QUESTIONS.forEach(q => {
    sums[q.dim] += (answers[q.id] || 3);
  });

  // Convert to 0-100 scale, >75 means first letter strongly
  const toPercent = raw => Math.round((raw - 30) / 120 * 100);
  const pct = {
    ei: toPercent(sums.ei), // >50 = I, <50 = E
    sn: toPercent(sums.sn), // >50 = S, <50 = N
    tf: toPercent(sums.tf), // >50 = T, <50 = F
    jp: toPercent(sums.jp), // >50 = J, <50 = P
  };

  const type =
    (pct.ei >= 50 ? 'I' : 'E') +
    (pct.sn >= 50 ? 'S' : 'N') +
    (pct.tf >= 50 ? 'T' : 'F') +
    (pct.jp >= 50 ? 'J' : 'P');

  return { type, pct };
}

// ============================================================
//  SUBMIT
// ============================================================
function submitQuiz() {
  const { type, pct } = calcScores();
  const info = TYPE_DATA[type] || { name:'独特人格', desc:'你的组合很罕见，无法用单一标签定义你。', traits:['独特','多元','复杂'] };

  document.getElementById('quiz-page').style.display = 'none';
  const rp = document.getElementById('result-page');
  rp.style.display = 'block';
  window.scrollTo(0, 0);

  document.getElementById('result-type-text').textContent = type;
  document.getElementById('result-name-text').textContent = `${type} · ${info.name}`;
  document.getElementById('result-desc-text').textContent = info.desc;

  // Dimension bars
  const dimInfo = [
    { dim:'ei', leftLabel:'I 内向', rightLabel:'E 外向', fill: pct.ei, fillColor:'#4f46e5', letter: pct.ei >= 50 ? 'I' : 'E' },
    { dim:'sn', leftLabel:'S 实感', rightLabel:'N 直觉', fill: pct.sn, fillColor:'#d97706', letter: pct.sn >= 50 ? 'S' : 'N' },
    { dim:'tf', leftLabel:'T 思考', rightLabel:'F 情感', fill: pct.tf, fillColor:'#0891b2', letter: pct.tf >= 50 ? 'T' : 'F' },
    { dim:'jp', leftLabel:'J 判断', rightLabel:'P 感知', fill: pct.jp, fillColor:'#16a34a', letter: pct.jp >= 50 ? 'J' : 'P' },
  ];

  const barsEl = document.getElementById('dim-bars');
  barsEl.innerHTML = '';
  dimInfo.forEach(d => {
    const score = d.fill; // 0-100, >50 means left (first) letter
    const leftPct = score;
    const card = document.createElement('div');
    card.className = 'dim-bar-card';
    card.innerHTML = `
      <div class="dim-bar-top">
        <span class="dim-bar-left">${d.leftLabel}</span>
        <span class="dim-bar-pct">${score >= 50 ? d.leftLabel.split(' ')[0] : d.rightLabel.split(' ')[0]} ${score >= 50 ? score : 100-score}%</span>
        <span class="dim-bar-right">${d.rightLabel}</span>
      </div>
      <div class="dim-track">
        <div class="dim-fill" id="fill-${d.dim}" style="width:0%;background:${d.fillColor}"></div>
        <div class="dim-mid"></div>
      </div>`;
    barsEl.appendChild(card);
    setTimeout(() => {
      document.getElementById(`fill-${d.dim}`).style.width = leftPct + '%';
    }, 100);
  });

  // Traits
  const traitsEl = document.getElementById('traits-grid');
  traitsEl.innerHTML = '';
  info.traits.forEach(t => {
    const tag = document.createElement('span');
    tag.className = 'trait-tag';
    tag.textContent = t;
    traitsEl.appendChild(tag);
  });

  // Detail - 使用 getAnalysis() 生成深度分析
  const dimNames = { ei: 'E/I 能量', sn: 'S/N 感知', tf: 'T/F 决策', jp: 'J/P 秩序' };
  const detailHtml = ['ei', 'sn', 'tf', 'jp'].map(dim => {
    const analysis = getAnalysis(type, dim, pct[dim]);
    return `<div style="margin-bottom:16px;"><strong>${dimNames[dim]}：</strong> ${analysis}</div>`;
  }).join('');
  document.getElementById('detail-content').innerHTML = detailHtml;

  // Save result to URL hash for sharing
  const resultStr = btoa(JSON.stringify({ type, pct }));
  window.location.hash = 'result=' + resultStr;
}

// ============================================================
//  SHARE
// ============================================================
function openShare() {
  const modal = document.getElementById('share-modal');
  const baseUrl = window.location.href.split('#')[0];
  const shareUrl = baseUrl;
  document.getElementById('share-url-text').textContent = shareUrl;
  modal.classList.add('open');
}
function closeShare() { document.getElementById('share-modal').classList.remove('open'); }
function copyUrl() {
  const url = document.getElementById('share-url-text').textContent;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(() => showToast('链接已复制，快去分享给朋友！'));
  } else {
    const el = document.createElement('textarea');
    el.value = url;
    document.body.appendChild(el);
    el.select();
    document.execCommand('copy');
    document.body.removeChild(el);
    showToast('链接已复制！');
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ============================================================
//  RETAKE
// ============================================================
function retakeQuiz() {
  Object.keys(answers).forEach(k => delete answers[k]);
  document.querySelectorAll('.scale-btn.active').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.q-card.answered').forEach(c => c.classList.remove('answered'));
  document.getElementById('result-page').style.display = 'none';
  document.getElementById('quiz-page').style.display = 'block';
  window.location.hash = '';
  updateProgress();
  window.scrollTo(0, 0);
}

// ============================================================
//  SCROLL TO TOP BUTTON
// ============================================================
window.addEventListener('scroll', () => {
  const btn = document.getElementById('back-top');
  btn.classList.toggle('show', window.scrollY > 400);
});

// ============================================================
//  INIT
// ============================================================
buildQuestions();
updateProgress();
</script>
